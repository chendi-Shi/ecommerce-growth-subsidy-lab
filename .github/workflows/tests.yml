name: analytics-checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m campaign.run --quick --output /tmp/campaign-smoke
      - name: Reconstruct frozen policies and verify decision diagnostics
        run: python -m campaign.decision --output /tmp/campaign-decision
